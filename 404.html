<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Redirecting - AshBoard</title>
    <script>
        // Intelligent client-side router fallback for GitHub Pages
        (function() {
            var path = window.location.pathname;
            if (path.includes('/admin')) {
                window.location.replace(window.location.origin + window.location.pathname.replace(/\/admin\/?$/, '') + '/admin/index.html');
            } else {
                window.location.replace(window.location.origin + window.location.pathname.split('/')[1] ? '/' + window.location.pathname.split('/')[1] + '/index.html' : '/index.html');
            }
        })();
    </script>
</head>
<body style="background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
        <h2>Mengalihkan ke Portal AshBoard...</h2>
        <p><a href="admin/" style="color: #38bdf8;">Klik di sini jika tidak dialihkan secara otomatis</a></p>
    </div>
</body>
</html>
